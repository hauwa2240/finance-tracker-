<!DOCTYPE html>
<html>
<head>
    <title>My Personal Finance Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .description {
            text-align: center;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-button {
            background-color: #333;
            color: white;
            width: 100%;
        }

        .total {
            background-color: #f4f6f8;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .expense {
            background-color: #f4f6f8;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .delete-button {
            background-color: #d9534f;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My Personal Finance Tracker</h1>

        <p class="description">
            Track your expenses and monitor your spending.
        </p>


        <!-- Expense Name -->

        <input
            type="text"
            id="expenseName"
            placeholder="Expense name"
        >


        <!-- Amount -->

        <input
            type="number"
            id="amount"
            placeholder="Amount"
        >


        <!-- Category -->

        <select id="category">

            <option value="">Select category</option>

            <option value="Food">Food</option>

            <option value="Transport">Transport</option>

            <option value="Education">Education</option>

            <option value="Shopping">Shopping</option>

            <option value="Other">Other</option>

        </select>


        <!-- Add Button -->

        <button class="add-button" onclick="addExpense()">
            Add Expense
        </button>


        <!-- Total -->

        <div class="total">

            <h2>Total Spent</h2>

            <h2>₦<span id="totalAmount">0</span></h2>

        </div>


        <h2>My Expenses</h2>

        <div id="expenseList"></div>

    </div>


    <script>

        // This is where we keep our expenses.

        let expenses = [];


        // This function adds a new expense.

        function addExpense() {

            // Get information from the input boxes.

            let expenseName =
                document.getElementById("expenseName").value;

            let amount =
                document.getElementById("amount").value;

            let category =
                document.getElementById("category").value;


            // Check if all the fields are filled.

            if (expenseName == "" || amount == "" || category == "") {

                alert("Please fill in all the fields.");

                return;
            }


            // Create an expense.

            let expense = {

                name: expenseName,

                amount: Number(amount),

                category: category

            };


            // Add the expense to our list.

            expenses.push(expense);


            // Display the expenses.

            displayExpenses();


            // Clear the input boxes.

            document.getElementById("expenseName").value = "";

            document.getElementById("amount").value = "";

            document.getElementById("category").value = "";

        }


        // This function displays the expenses.

        function displayExpenses() {

            let expenseList =
                document.getElementById("expenseList");


            // Clear the old list.

            expenseList.innerHTML = "";


            // Go through every expense.

            for (let i = 0; i < expenses.length; i++) {

                let expense = expenses[i];


                // Create an area for the expense.

                let expenseDiv =
                    document.createElement("div");

                expenseDiv.className = "expense";


                // Add the expense information.

                expenseDiv.innerHTML =
                    "<strong>" + expense.name + "</strong><br>" +
                    "Amount: ₦" + expense.amount + "<br>" +
                    "Category: " + expense.category;


                // Create the Delete button.

                let deleteButton =
                    document.createElement("button");

                deleteButton.innerHTML = "Delete";

                deleteButton.className = "delete-button";


                // Tell the button what to do.

                deleteButton.onclick = function() {

                    deleteExpense(i);

                };


                // Add the button to the expense.

                expenseDiv.appendChild(deleteButton);


                // Add the expense to the page.

                expenseList.appendChild(expenseDiv);

            }


            // Update the total.

            updateTotal();

        }


        // This function deletes an expense.

        function deleteExpense(number) {

            expenses.splice(number, 1);

            displayExpenses();

        }


        // This function calculates the total amount spent.

        function updateTotal() {

            let total = 0;


            // Add all the expenses together.

            for (let i = 0; i < expenses.length; i++) {

                total = total + expenses[i].amount;

            }


            // Show the total on the page.

            document.getElementById("totalAmount").innerHTML = total;

        }

    </script>

</body>
</html>
